[pytest]
# The gate runs exactly this: unit tests (DB-free, seconds) + guards (code scans).
# Integration tests, if ever added, live in tests/integration and are opt-in.
testpaths = tests/unit tests/guards
addopts = -q --tb=short
# pytest-asyncio may be installed globally though these tests are sync: quiet its config nag.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
